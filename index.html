<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Virtual Email & Live OTP Receiver — TAKAAA</title>

  <style>
    :root {
      --bg-body: #050814;
      --bg-card: rgba(13, 20, 38, 0.92);
      --bg-input: rgba(22, 33, 62, 0.9);
      --border: rgba(148, 163, 184, 0.16);
      --primary: #10b981;
      --primary-light: #34d399;
      --secondary: #38bdf8;
      --gold: #fbbf24;
      --danger: #f87171;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-body);
      color: var(--text-main);
      line-height: 1.6;
      padding: 20px 14px 52px;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
      background-image:
        radial-gradient(circle at 12% 8%, rgba(16, 185, 129, 0.22) 0%, transparent 42%),
        radial-gradient(circle at 88% 88%, rgba(56, 189, 248, 0.2) 0%, transparent 45%),
        radial-gradient(circle at 50% 45%, rgba(251, 191, 36, 0.08) 0%, transparent 50%);
    }

    #particle-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .container {
      max-width: 820px;
      margin: 0 auto;
      position: relative;
      z-index: 2;
    }

    /* Top Luxury Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 24px;
      padding: 12px 16px;
      background: rgba(13, 20, 38, 0.94);
      border: 1px solid rgba(52, 211, 153, 0.25);
      border-radius: 16px;
      box-shadow: 0 14px 35px rgba(0, 0, 0, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    .top-left {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .brand-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      padding: 6px 13px;
      border-radius: 999px;
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.28), rgba(56, 189, 248, 0.24));
      border: 1px solid rgba(52, 211, 153, 0.45);
      color: #ffffff;
      text-transform: uppercase;
      box-shadow: 0 0 18px rgba(16, 185, 129, 0.25);
    }

    .live-status {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 0.76rem;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 999px;
      background-color: rgba(16, 185, 129, 0.14);
      color: var(--primary-light);
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .live-status.error {
      background-color: rgba(248, 113, 113, 0.16);
      color: var(--danger);
      border-color: rgba(248, 113, 113, 0.38);
    }

    .dot-pulse {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: currentColor;
      animation: pulse 1.6s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.7); }
      70% { box-shadow: 0 0 0 7px rgba(52, 211, 153, 0); }
      100% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0); }
    }

    .btn-donate-top {
      background: linear-gradient(135deg, rgba(244, 63, 94, 0.24), rgba(251, 113, 133, 0.16));
      color: #fda4af;
      border: 1px solid rgba(244, 63, 94, 0.45);
      padding: 6px 14px;
      font-size: 0.78rem;
      border-radius: 999px;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    .creator-tag {
      display: inline-block;
      font-size: 0.74rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--gold);
      background: rgba(251, 191, 36, 0.1);
      border: 1px solid rgba(251, 191, 36, 0.3);
      padding: 4px 14px;
      border-radius: 999px;
      margin-bottom: 10px;
    }

    header h1 {
      font-size: 1.9rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.2;
      margin-bottom: 8px;
      text-shadow: 0 6px 24px rgba(0, 0, 0, 0.6);
    }

    header h1 .gradient-text {
      background: linear-gradient(135deg, #34d399 0%, #38bdf8 55%, #fbbf24 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.9rem;
      max-width: 580px;
      margin: 0 auto;
    }

    /* 3D Luxury Elevated Card */
    .card {
      background: linear-gradient(160deg, rgba(16, 25, 48, 0.95) 0%, rgba(9, 14, 28, 0.97) 100%);
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-top: 1px solid rgba(52, 211, 153, 0.4);
      border-radius: 22px;
      padding: 22px;
      box-shadow:
        0 22px 50px rgba(0, 0, 0, 0.75),
        0 0 0 1px rgba(16, 185, 129, 0.08),
        inset 0 1px 0 rgba(255, 255, 255, 0.1);
      margin-bottom: 20px;
      transition: transform 0.22s ease, box-shadow 0.22s ease;
    }

    .card:hover {
      box-shadow:
        0 28px 60px rgba(0, 0, 0, 0.85),
        0 0 25px rgba(16, 185, 129, 0.14),
        inset 0 1px 0 rgba(255, 255, 255, 0.14);
    }

    .custom-builder-grid {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      margin-bottom: 12px;
      align-items: end;
    }

    @media (max-width: 560px) {
      .custom-builder-grid {
        grid-template-columns: 1fr;
      }
      header h1 {
        font-size: 1.6rem;
      }
    }

    .input-group-box {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field-label {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .pattern-hint {
      font-family: monospace;
      font-size: 0.72rem;
      color: var(--primary-light);
    }

    .prefix-input-wrap {
      display: flex;
      align-items: center;
      background-color: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0 12px;
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.45);
    }

    .prefix-input-wrap:focus-within {
      border-color: var(--primary);
    }

    .prefix-input {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-main);
      font-family: monospace;
      font-size: 0.88rem;
      font-weight: 600;
      padding: 11px 0;
      outline: none;
      min-width: 0;
    }

    .suffix-preview-tag {
      font-family: monospace;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--primary-light);
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 3px 8px;
      border-radius: 7px;
      white-space: nowrap;
      margin-left: 8px;
    }

    .domain-select {
      background-color: var(--bg-input);
      color: var(--text-main);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 11px 12px;
      font-family: monospace;
      font-size: 0.84rem;
      font-weight: 600;
      outline: none;
      height: 44px;
    }

    .email-display-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: #060a16;
      border: 1px solid rgba(52, 211, 153, 0.45);
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 14px;
      box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.6);
    }

    .active-email-text {
      font-family: monospace;
      font-size: 0.96rem;
      font-weight: 700;
      color: var(--primary-light);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
    }

    .error-detail {
      display: none;
      font-size: 0.8rem;
      color: #fca5a5;
      background: rgba(239, 68, 68, 0.14);
      border: 1px solid rgba(239, 68, 68, 0.35);
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 14px;
    }

    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    button {
      padding: 12px 16px;
      border: none;
      border-radius: 12px;
      font-family: inherit;
      font-size: 0.86rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      transition: all 0.18s ease;
    }

    button:active {
      transform: scale(0.97);
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .btn-primary {
      background: linear-gradient(135deg, #34d399 0%, #10b981 55%, #059669 100%);
      color: #032615;
      flex: 1;
      min-width: 150px;
      box-shadow: 0 8px 22px rgba(16, 185, 129, 0.32), inset 0 1px 0 rgba(255, 255, 255, 0.35);
    }

    .btn-gold {
      background: linear-gradient(135deg, #fde047 0%, #fbbf24 55%, #d97706 100%);
      color: #1f1300;
      flex: 1;
      min-width: 160px;
      box-shadow: 0 8px 22px rgba(251, 191, 36, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.4);
    }

    .btn-save {
      background: rgba(245, 158, 11, 0.16);
      color: #fcd34d;
      border: 1px solid rgba(245, 158, 11, 0.4);
    }

    .btn-save.full-warning {
      background: rgba(248, 113, 113, 0.16);
      color: #fca5a5;
      border-color: rgba(248, 113, 113, 0.4);
    }

    .btn-secondary {
      background: rgba(56, 189, 248, 0.16);
      color: #93c5fd;
      border: 1px solid rgba(56, 189, 248, 0.38);
    }

    .btn-copy-main {
      padding: 8px 14px;
      font-size: 0.82rem;
      background: linear-gradient(135deg, #34d399, #10b981);
      color: #032615;
      border-radius: 9px;
      flex-shrink: 0;
    }

    /* Roblox Gmail Helper Section */
    .roblox-box {
      border-top: 1px solid rgba(251, 191, 36, 0.45);
      background: linear-gradient(160deg, rgba(24, 21, 12, 0.94) 0%, rgba(11, 15, 28, 0.97) 100%);
    }

    .roblox-title {
      font-size: 1rem;
      font-weight: 800;
      color: var(--gold);
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }

    .roblox-desc {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .alias-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 12px;
    }

    .alias-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: #070b15;
      border: 1px solid rgba(251, 191, 36, 0.25);
      padding: 9px 12px;
      border-radius: 11px;
    }

    .alias-email {
      font-family: monospace;
      font-size: 0.82rem;
      font-weight: 600;
      color: #fef3c7;
      word-break: break-all;
    }

    /* Vault */
    .vault-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }

    .vault-title {
      font-size: 0.95rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-clear-all {
      padding: 5px 10px;
      font-size: 0.74rem;
      border-radius: 8px;
      background: rgba(248, 113, 113, 0.14);
      color: #fca5a5;
      border: 1px solid rgba(248, 113, 113, 0.32);
    }

    .vault-slots {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 10px;
    }

    .slot-card {
      background: #080e1d;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 10px;
    }

    .slot-card.active-slot {
      border-color: var(--primary);
      background: rgba(16, 185, 129, 0.12);
    }

    .slot-card.empty-slot {
      border-style: dashed;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.78rem;
      min-height: 92px;
    }

    .slot-top {
      display: flex;
      justify-content: space-between;
      font-size: 0.72rem;
      color: var(--text-muted);
    }

    .slot-badge {
      font-weight: 700;
      color: var(--primary-light);
    }

    .slot-email {
      font-family: monospace;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-main);
      word-break: break-all;
    }

    .slot-actions {
      display: flex;
      gap: 6px;
    }

    .btn-slot {
      padding: 7px 10px;
      font-size: 0.74rem;
      border-radius: 8px;
      flex: 1;
    }

    .btn-slot-use {
      background: rgba(16, 185, 129, 0.18);
      color: var(--primary-light);
      border: 1px solid rgba(16, 185, 129, 0.35);
    }

    .btn-slot-del {
      background: rgba(239, 68, 68, 0.16);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.38);
      flex: 0 0 auto;
    }

    /* Inbox */
    .inbox-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      padding-bottom: 14px;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    .badge-count {
      background-color: rgba(16, 185, 129, 0.15);
      color: var(--primary-light);
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 2px 10px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
      margin-left: 6px;
    }

    .timer-text {
      font-size: 0.78rem;
      color: var(--text-muted);
      font-family: monospace;
    }

    .message-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .empty-inbox {
      text-align: center;
      padding: 36px 16px;
      color: var(--text-muted);
      font-size: 0.9rem;
      background: #070b15;
      border: 1px dashed var(--border);
      border-radius: 14px;
    }

    .msg-card {
      background: #080e1d;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
    }

    .msg-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
    }

    .msg-sender {
      font-size: 0.82rem;
      font-weight: 700;
      color: #93c5fd;
    }

    .msg-time {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .msg-subject {
      font-size: 0.96rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .otp-highlight {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.45);
      border-radius: 10px;
      padding: 10px 14px;
      margin-bottom: 10px;
    }

    .otp-code {
      font-family: monospace;
      font-size: 1.3rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      color: var(--primary-light);
    }

    .msg-body {
      font-size: 0.84rem;
      color: var(--text-muted);
      background: #050811;
      padding: 10px 12px;
      border-radius: 9px;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 160px;
      overflow-y: auto;
    }

    footer {
      text-align: center;
      margin-top: 28px;
      padding-top: 18px;
      border-top: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 0.82rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .btn-donate-footer {
      background: rgba(244, 63, 94, 0.14);
      color: #fda4af;
      border: 1px solid rgba(244, 63, 94, 0.35);
      padding: 8px 18px;
      font-size: 0.82rem;
      border-radius: 999px;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.86);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 1000;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-box {
      background: #0f172a;
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 22px;
      max-width: 380px;
      width: 100%;
      padding: 22px;
      text-align: center;
      position: relative;
    }

    .modal-close {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 32px;
      height: 32px;
      padding: 0;
      border-radius: 50%;
      background: #1e293b;
      color: var(--text-muted);
    }

    .qris-frame {
      background: #ffffff;
      border-radius: 14px;
      padding: 8px;
      margin: 14px auto;
      max-width: 240px;
    }

    .qris-frame img {
      width: 100%;
      display: block;
      border-radius: 8px;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      right: 16px;
      left: 16px;
      max-width: 400px;
      margin: 0 auto;
      text-align: center;
      background: linear-gradient(135deg, #10b981, #059669);
      color: #032615;
      padding: 12px 20px;
      border-radius: 12px;
      font-weight: 800;
      font-size: 0.86rem;
      transform: translateY(120px);
      opacity: 0;
      transition: all 0.3s ease;
      z-index: 1100;
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>

  <canvas id="particle-canvas"></canvas>

  <div class="container">
    <div class="top-bar">
      <div class="top-left">
        <span class="brand-chip">⚡ TAKAAA</span>
        <div class="live-status" id="statusBadge">
          <span class="dot-pulse"></span>
          <span id="statusText">Menghubungkan...</span>
        </div>
      </div>
      <button class="btn-donate-top" onclick="openDonateModal()">❤️ Support / QRIS</button>
    </div>

    <header>
      <div class="creator-tag">✦ LUXURY 3D OTP & ROBLOX SUITE ✦</div>
      <h1>Virtual Email & <span class="gradient-text">Live OTP Receiver</span></h1>
      <p>Generator email sementara instan, penerima kode OTP otomatis, dan generator alias Gmail khusus Roblox.</p>
    </header>

    <!-- CARD 1: TEMP MAIL GENERATOR -->
    <div class="card">
      <div class="custom-builder-grid">
        <div class="input-group-box">
          <label class="field-label">
            <span>Custom Username (Opsional)</span>
            <span class="pattern-hint">huruf/angka</span>
          </label>
          <div class="prefix-input-wrap">
            <input type="text" id="customPrefixInput" class="prefix-input" placeholder="contoh: takaaa.pro" maxlength="24" />
            <span class="suffix-preview-tag" id="suffixPreview">@domain</span>
          </div>
        </div>
        <div class="input-group-box">
          <label class="field-label"><span>Pilih Domain</span></label>
          <select id="domainSelect" class="domain-select" onchange="updateSuffixPreview()">
            <option value="1secmail.com">@1secmail.com</option>
          </select>
        </div>
      </div>

      <div class="email-display-box">
        <div class="active-email-text" id="activeEmailDisplay">Membuat alamat email...</div>
        <button class="btn-copy-main" onclick="copyText(currentEmail, 'Alamat email disalin!')">📋 Salin</button>
      </div>

      <div class="error-detail" id="errorBox"></div>

      <div class="btn-group">
        <button class="btn-primary" id="btnGenerate" onclick="generateNewEmail()">
          ✨ Buat Email Baru
        </button>
        <button class="btn-save" id="btnSaveSlot" onclick="saveCurrentToVault()">
          💾 Simpan (0/3)
        </button>
        <button class="btn-secondary" onclick="checkInbox(true)">
          🔄 Cek Inbox
        </button>
      </div>
    </div>

    <!-- CARD 2: KHUSUS ROBLOX (GMAIL UNLIMITED ALIAS) -->
