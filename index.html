<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>TAKAAA — Luxury Virtual Email & Live OTP Receiver</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-void: #03050a;
      --bg-card: rgba(10, 15, 28, 0.72);
      --bg-card-elevated: rgba(17, 25, 45, 0.85);
      --bg-input: rgba(7, 11, 20, 0.85);
      --border-glass: rgba(255, 255, 255, 0.08);
      --border-emerald: rgba(16, 185, 129, 0.4);
      --border-gold: rgba(245, 158, 11, 0.45);
      --emerald: #10b981;
      --emerald-glow: #34d399;
      --cyan: #38bdf8;
      --gold: #fbbf24;
      --rose: #f43f5e;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --shadow-luxury: 0 25px 60px -15px rgba(0, 0, 0, 0.85), inset 0 1px 0 rgba(255, 255, 255, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-void);
      color: var(--text-main);
      line-height: 1.6;
      padding: 24px 16px 60px;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
      perspective: 1200px;
    }

    /* 3D Interactive Particle Canvas */
    #particle-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: -2;
      pointer-events: none;
    }

    /* Ambient Luxury Orbs */
    .ambient-orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(140px);
      z-index: -1;
      pointer-events: none;
      opacity: 0.4;
      animation: floatOrb 12s ease-in-out infinite alternate;
    }

    .orb-1 {
      width: 450px;
      height: 450px;
      top: -150px;
      left: -120px;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.45), transparent 70%);
    }

    .orb-2 {
      width: 420px;
      height: 420px;
      bottom: -150px;
      right: -100px;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.35), transparent 70%);
      animation-delay: -5s;
    }

    .orb-3 {
      width: 300px;
      height: 300px;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, rgba(251, 191, 36, 0.14), transparent 70%);
    }

    @keyframes floatOrb {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(30px, -25px) scale(1.08); }
    }

    .container {
      max-width: 860px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    /* Top Luxury Navigation Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 28px;
      padding: 12px 18px;
      background: rgba(10, 15, 28, 0.65);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-glass);
      border-radius: 18px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    .top-left {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .brand-chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      padding: 6px 14px;
      border-radius: 999px;
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.22), rgba(251, 191, 36, 0.18));
      border: 1px solid rgba(52, 211, 153, 0.45);
      color: #ffffff;
      text-transform: uppercase;
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.2);
    }

    .live-status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.76rem;
      font-weight: 600;
      padding: 6px 13px;
      border-radius: 999px;
      background-color: rgba(16, 185, 129, 0.12);
      color: var(--emerald-glow);
      border: 1px solid rgba(16, 185, 129, 0.3);
      transition: all 0.3s ease;
    }

    .live-status.error {
      background-color: rgba(244, 63, 94, 0.14);
      color: #fda4af;
      border-color: rgba(244, 63, 94, 0.4);
    }

    .dot-pulse {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: currentColor;
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.75); }
      70% { box-shadow: 0 0 0 8px rgba(52, 211, 153, 0); }
      100% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0); }
    }

    .btn-donate-top {
      background: linear-gradient(135deg, rgba(244, 63, 94, 0.22), rgba(251, 191, 36, 0.16));
      color: #fecdd3;
      border: 1px solid rgba(244, 63, 94, 0.45);
      padding: 7px 16px;
      font-size: 0.78rem;
      border-radius: 999px;
      box-shadow: 0 4px 15px rgba(244, 63, 94, 0.18);
    }

    .btn-donate-top:hover {
      background: linear-gradient(135deg, #f43f5e, #e11d48);
      color: #ffffff;
      border-color: transparent;
      transform: translateY(-1px);
      box-shadow: 0 8px 22px rgba(244, 63, 94, 0.4);
    }

    /* Hero Header */
    header {
      text-align: center;
      margin-bottom: 28px;
    }

    .creator-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.74rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--gold);
      background: rgba(251, 191, 36, 0.08);
      border: 1px solid rgba(251, 191, 36, 0.25);
      padding: 5px 14px;
      border-radius: 999px;
      margin-bottom: 12px;
    }

    header h1 {
      font-size: 2.25rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.18;
      margin-bottom: 10px;
      text-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
    }

    header h1 .gradient-text {
      background: linear-gradient(135deg, #ffffff 0%, #34d399 42%, #38bdf8 78%, #fbbf24 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.94rem;
      max-width: 610px;
      margin: 0 auto;
    }

    /* 3D Luxury Glass Card */
    .card {
      background: var(--bg-card);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border-glass);
      border-radius: 24px;
      padding: 26px;
      box-shadow: var(--shadow-luxury);
      margin-bottom: 22px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .card::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 24px;
      padding: 1px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.16), rgba(16, 185, 129, 0.22), rgba(255, 255, 255, 0.02));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    .card:hover {
      border-color: rgba(52, 211, 153, 0.25);
    }

    /* Tabs Mode Selector (Temp Mail vs Gmail Dot/Plus Trick) */
    .mode-tabs {
      display: flex;
      gap: 8px;
      background: rgba(5, 8, 17, 0.75);
      padding: 6px;
      border-radius: 14px;
      border: 1px solid var(--border-glass);
      margin-bottom: 18px;
    }

    .mode-tab {
      flex: 1;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 0.82rem;
      font-weight: 700;
      background: transparent;
      color: var(--text-muted);
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .mode-tab.active {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.22), rgba(56, 189, 248, 0.16));
      color: #ffffff;
      border-color: rgba(52, 211, 153, 0.45);
      box-shadow: 0 4px 16px rgba(16, 185, 129, 0.18);
    }

    .mode-tab.gold-tab.active {
      background: linear-gradient(135deg, rgba(251, 191, 36, 0.22), rgba(245, 158, 11, 0.14));
      color: #fef3c7;
      border-color: rgba(251, 191, 36, 0.45);
      box-shadow: 0 4px 16px rgba(251, 191, 36, 0.16);
    }

    .tab-panel {
      display: none;
    }

    .tab-panel.active {
      display: block;
      animation: fadeSlide 0.3s ease;
    }

    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Custom Builder Grid */
    .custom-builder-grid {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      margin-bottom: 14px;
      align-items: end;
    }

    @media (max-width: 600px) {
      .custom-builder-grid {
        grid-template-columns: 1fr;
      }
      header h1 {
        font-size: 1.75rem;
      }
    }

    .input-group-box {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .field-label {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .pattern-hint {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      color: var(--emerald-glow);
    }

    .prefix-input-wrap {
      display: flex;
      align-items: center;
      background-color: var(--bg-input);
      border: 1px solid var(--border-glass);
      border-radius: 13px;
      padding: 0 14px;
      transition: all 0.25s ease;
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.4);
    }

    .prefix-input-wrap:focus-within {
      border-color: var(--emerald);
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15), inset 0 2px 6px rgba(0, 0, 0, 0.4);
    }

    .prefix-input {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-main);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.88rem;
      font-weight: 600;
      padding: 12px 0;
      outline: none;
      min-width: 0;
    }

    .prefix-input::placeholder {
      color: rgba(148, 163, 184, 0.45);
      font-weight: 400;
    }

    .suffix-preview-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--emerald-glow);
      background: rgba(16, 185, 129, 0.14);
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 4px 9px;
      border-radius: 8px;
      white-space: nowrap;
      margin-left: 8px;
    }

    .domain-select {
      background-color: var(--bg-input);
      color: var(--text-main);
      border: 1px solid var(--border-glass);
      border-radius: 13px;
      padding: 12px 14px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.84rem;
      font-weight: 600;
      outline: none;
      cursor: pointer;
      height: 46px;
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.4);
    }

    .domain-select:focus {
      border-color: var(--emerald);
    }

    /* Active Email Display Box */
    .email-display-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: linear-gradient(135deg, rgba(7, 12, 24, 0.9), rgba(15, 26, 46, 0.85));
      border: 1px solid rgba(52, 211, 153, 0.4);
      border-radius: 16px;
      padding: 15px 18px;
      margin-bottom: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    .active-email-text {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1rem;
      font-weight: 700;
      color: var(--emerald-glow);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
      text-shadow: 0 0 18px rgba(52, 211, 153, 0.35);
    }

    .error-detail {
      display: none;
      font-size: 0.8rem;
      color: #fecdd3;
      background: rgba(244, 63, 94, 0.14);
      border: 1px solid rgba(244, 63, 94, 0.35);
      border-radius: 12px;
      padding: 11px 14px;
      margin-bottom: 14px;
    }

    .info-banner-roblox {
      font-size: 0.8rem;
      color: #fde68a;
      background: rgba(251, 191, 36, 0.09);
      border: 1px solid rgba(251, 191, 36, 0.28);
      border-radius: 12px;
      padding: 11px 14px;
      margin-bottom: 14px;
      line-height: 1.5;
    }

    /* Buttons */
    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    button, .btn-link {
      padding: 12px 18px;
      border: none;
      border-radius: 13px;
      font-family: inherit;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      transition: all 0.22s cubic-bezier(0.22, 1, 0.36, 1);
    }

    button:active {
      transform: scale(0.97);
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .btn-primary {
      background: linear-gradient(135deg, #34d399 0%, #10b981 50%, #059669 100%);
      color: #022c19;
      flex: 1;
      min-width: 170px;
      box-shadow: 0 10px 25px rgba(16, 185, 129, 0.32), inset 0 1px 0 rgba(255, 255, 255, 0.4);
    }

    .btn-primary:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 14px 32px rgba(16, 185, 129, 0.48), inset 0 1px 0 rgba(255, 255, 255, 0.5);
    }

    .btn-gold {
      background: linear-gradient(135deg, #fde047 0%, #fbbf24 50%, #d97706 100%);
      color: #1f1300;
      flex: 1;
      min-width: 170px;
      box-shadow: 0 10px 25px rgba(251, 191, 36, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.45);
    }

    .btn-gold:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 14px 32px rgba(251, 191, 36, 0.42);
    }

    .btn-save {
      background: rgba(251, 191, 36, 0.14);
      color: #fde68a;
      border: 1px solid rgba(251, 191, 36, 0.4);
    }

    .btn-save:hover:not(:disabled) {
      background: #fbbf24;
      color: #0f172a;
      transform: translateY(-1px);
    }

    .btn-save.full-warning {
      background: rgba(244, 63, 94, 0.15);
      color: #fda4af;
      border-color: rgba(244, 63, 94, 0.4);
    }

    .btn-secondary {
      background: rgba(56, 189, 248, 0.14);
      color: #bae6fd;
      border: 1px solid rgba(56, 189, 248, 0.35);
    }

    .btn-secondary:hover:not(:disabled) {
      background: #0284c7;
      color: #ffffff;
      transform: translateY(-1px);
    }

    .btn-copy-main {
      padding: 9px 15px;
      font-size: 0.82rem;
      background: linear-gradient(135deg, #34d399, #10b981);
      color: #022c19;
      border-radius: 10px;
      flex-shrink: 0;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);
    }

    .btn-copy-main:hover {
      transform: scale(1.03);
    }

    /* Alias List for Roblox Mode */
    .alias-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 14px;
      max-height: 240px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .alias-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: rgba(15, 23, 42, 0.72);
      border: 1px solid var(--border-glass);
      padding: 10px 14px;
      border-radius: 12px;
      transition: border-color 0.2s ease;
    }

    .alias-item:hover {
      border-color: rgba(251, 191, 36, 0.45);
    }

    .alias-email {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.84rem;
      font-weight: 600;
      color: #fef3c7;
      word-break: break-all;
    }

    /* Saved Accounts Vault (Max 3) */
    .vault-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }

    .vault-title {
      font-size: 0.98rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .vault-header-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-clear-all {
      padding: 6px 12px;
      font-size: 0.74rem;
      border-radius: 9px;
      background: rgba(244, 63, 94, 0.14);
      color: #fda4af;
      border: 1px solid rgba(244, 63, 94, 0.35);
    }

    .btn-clear-all:hover {
      background: #e11d48;
      color: #ffffff;
    }

    .vault-slots {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 12px;
    }

    .slot-card {
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid var(--border-glass);
      border-radius: 16px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 10px;
      transition: all 0.25s ease;
    }

    .slot-card.active-slot {
      border-color: var(--emerald);
      background: linear-gradient(145deg, rgba(16, 185, 129, 0.14), rgba(15, 23, 42, 0.8));
      box-shadow: 0 8px 25px rgba(16, 185, 129, 0.15);
    }

    .slot-card.empty-slot {
      border-style: dashed;
      border-color: rgba(148, 163, 184, 0.2);
      align-items: center;
      justify-content: center;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.8rem;
      min-height: 105px;
    }

    .slot-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.72rem;
      color: var(--text-muted);
    }

    .slot-badge {
      font-weight: 700;
      color: var(--emerald-glow);
    }

    .slot-email {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-main);
      word-break: break-all;
    }

    .slot-actions {
      display: flex;
      gap: 7px;
    }

    .btn-slot {
      padding: 8px 11px;
      font-size: 0.74rem;
      border-radius: 9px;
      flex: 1;
    }

    .btn-slot-use {
      background: rgba(16, 185, 129, 0.16);
      color: var(--emerald-glow);
      border: 1px solid rgba(16, 185, 129, 0.35);
    }

    .btn-slot-use:hover:not(:disabled) {
      background: var(--emerald);
      color: #022c19;
    }

    .btn-slot-del {
      background: rgba(244, 63, 94, 0.14);
      color: #fda4af;
      border: 1px solid rgba(244, 63, 94, 0.35);
      flex: 0 0 auto;
      padding: 8px 11px;
    }

    .btn-slot-del:hover, .btn-slot-del.confirming {
      background: #e11d48;
      color: #ffffff;
      border-color: #e11d48;
    }

    /* Live Inbox */
    .inbox-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      padding-bottom: 16px;
      margin-bottom: 18px;
      border-bottom: 1px solid var(--border-glass);
    }

    .badge-count {
      background-color: rgba(16, 185, 129, 0.16);
      color: var(--emerald-glow);
      border: 1px solid rgba(16, 185, 129, 0.35);
      padding: 3px 12px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
      margin-left: 6px;
    }

    .timer-text {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
    }

    .message-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .empty-inbox {
      text-align: center;
      padding: 42px 18px;
      color: var(--text-muted);
      font-size: 0.92rem;
      background: rgba(7, 11, 20, 0.45);
      border: 1px dashed rgba(148, 163, 184, 0.22);
      border-radius: 16px;
    }

    .msg-card {
      background: rgba(15, 23, 42, 0.78)
